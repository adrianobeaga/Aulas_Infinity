<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Javascript</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="a">
        <h1>Exercícios de Javascript</h1>
        <label for="idade">Digite sua idade:</label>
        <input type="number" name="idade" id="idade"><br>
        
        <label for="pago">Você pagou a taxa de inscrição? (Digite "sim" ou "não"):</label>
        <input type="text" name="pago" id="pago"><br>
        
        <p id="resultado"></p>
        <button onclick="action()">Clique aqui para executar a função</button>
    </div>

    <script>
        function action() {
            let idade = parseInt(document.getElementById('idade').value);
            let pago = document.getElementById('pago').value.toLowerCase().trim();
            let resultado = '';
            // Verifica se o valor inserido é válido
            if (pago !== 'sim' && pago != 'não' && pago !== 'nao'){
                resultado = 'Por favor, digite "sim" ou "não" corretamente.';
            }else if (idade >= 18 && (pago === "sim")){
                resultado = 'Parabéns! Voce foi cadastrado com sucesso!';
            }else{
                resultado = "Você não atende aos requisitos para se inscrever.";
            }
            document.getElementById('resultado').innerText = resultado;
        }
    </script>
</body>

</html>
