<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício While</title>
</head>

<body>
    <script>
        let contador = 10

        while (contador > 0) {
            document.writeln(contador)
            contador--                     
        }
        document.writeln("Fim da Contagem")
    </script>

</body>

</html>
