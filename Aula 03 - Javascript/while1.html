<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=sc, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // Estruturas de Repetição (While)

        let contador = 0; //variavel de Controle

        //Enquando o contador for menor que 10...
        while (contador < 10) {
            document.writeln(contador);
            contador++; // Incremento de +1
        }
        document.writeln("Fim da contagem.")

    </script>
</body>

</html>
